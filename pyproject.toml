[project]
name = "server-simulator"
version = "0.1.4"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.28.0,<0.29.0",
    "moviepy>=2.2.1",
    "numpy>=1,<2",
    "pygame>=2.1.3",
    "rust-enum>=1.1.5",
    "sb3-contrib>=2.3.0",
    "stable-baselines3[extra]>=2.3.2",
    "wandb>=0.25.1",
]

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "coverage>=7.13.3",
    "hypothesis>=6.148.1",
    "pre-commit>=4.5.1",
    "pyrefly>=0.51.1",
    "pytest>=8.4.2",
    "ruff>=0.14.0",
]

[tool.mypy]
plugins = ["numpy.typing.mypy_plugin"]

[tool.coverage.report]
omit = ["*/tests/*"]
show_missing = true

[tool.coverage.run]
branch = true

[tool.pytest.ini_options]
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)d)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
line-length = 88

[tool.hatch.build.targets.wheel]
packages = ["src/server_simulator"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
